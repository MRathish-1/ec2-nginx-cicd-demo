name: Deploy to EC2

on:
  push:
    branches: [main]

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::128695244589:role/github-actions-deploy-role
          aws-region: us-east-1
          role-skip-session-tagging: true

      - name: Upload index.html to S3
        run: aws s3 cp index.html s3://nginx-cicd-demo-artifacts-rm/index.html

      - name: Deploy via SSM
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-0be149bb3eec5d70e" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["aws s3 cp s3://nginx-cicd-demo-artifacts-rm/index.html /usr/share/nginx/html/index.html"]' \
            --query "Command.CommandId" \
            --output text)
          echo "Command ID: $COMMAND_ID"
          aws ssm wait command-executed --command-id "$COMMAND_ID" --instance-id "i-0be149bb3eec5d70e"
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "i-0be149bb3eec5d70e"